name: Supabase daily database health check
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-database-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test the database probe
        run: node --test tests/supabase-health.test.mjs
      - name: Read the production database through the server health endpoint
        run: node scripts/check-supabase-health.mjs
