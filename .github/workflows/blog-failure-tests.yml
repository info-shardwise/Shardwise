name: Blog automation failure tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Failure injection without provider credentials or production writes
        run: node --test tests/blog-automation.test.mjs
