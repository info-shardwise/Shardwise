name: Publish reviewed blog
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      row_id:
        description: auto selects next due reviewed keyword; use row ID to recover
        required: true
        default: auto
permissions:
  contents: write
  checks: read
  actions: read
concurrency:
  group: blog-automation-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      BLOG_SHEET_ID: ${{ secrets.BLOG_SHEET_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test tests/blog-automation.test.mjs
      - name: Select due reviewed keyword or recover existing publication
        id: select
        run: node scripts/blog-automation/schedule.mjs
        env:
          REQUESTED_ROW_ID: ${{ inputs.row_id || 'auto' }}
      - if: steps.select.outputs.ready == 'true'
        run: echo "BLOG_ROW_ID=${{ steps.select.outputs.row_id }}" >> "$GITHUB_ENV"
      - if: steps.select.outputs.ready == 'true'
        run: node scripts/blog-automation/publish.mjs prepare
      - if: steps.select.outputs.ready == 'true'
        run: npm run lint
      - if: steps.select.outputs.ready == 'true'
        run: node --test tests/contact.test.mjs
      - if: steps.select.outputs.ready == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://shardwise.pages.dev
      - if: steps.select.outputs.ready == 'true'
        run: node scripts/blog-automation/publish.mjs push
      - if: steps.select.outputs.ready == 'true'
        run: node scripts/blog-automation/publish.mjs verify
      - if: failure() && steps.select.outputs.ready == 'true'
        run: node scripts/blog-automation/publish.mjs failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-publication-receipt
          path: artifacts/blog-publication/
          retention-days: 7
